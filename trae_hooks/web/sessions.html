<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipVault · Trae 会话</title>
  <meta name="color-scheme" content="light" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --separator: rgba(60, 60, 67, 0.12);
      --card: #ffffff;
      --accent: #0071e3;
      --honey: #c47a2c;
      --honey-soft: rgba(196, 122, 44, 0.12);
      --user-ink: #8a5414;
      --tool: #1565c0;
      --tool-soft: rgba(21, 101, 192, 0.12);
      --system: #8e8e93;
      --system-soft: rgba(142, 142, 147, 0.14);
      --radius: 16px;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(196, 146, 66, 0.10), transparent 55%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 22px;
      background: rgba(245,245,247,0.78);
      backdrop-filter: blur(18px);
      border-bottom: 0.5px solid var(--separator);
    }
    h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; }
    .grow { flex: 1; }
    input[type="search"] {
      width: min(360px, 42vw);
      border: 0.5px solid transparent;
      background: rgba(120,120,128,0.12);
      border-radius: 980px;
      padding: 8px 14px;
      font: inherit;
    }
    input:focus { outline: none; background: #fff; border-color: rgba(0,113,227,0.35); }
    a.back {
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
    }
    main {
      display: grid; grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 58px); min-width: 0;
    }
    .list, .detail { padding: 16px 18px; min-width: 0; }
    .list { border-right: 0.5px solid var(--separator); overflow: auto; }
    .detail { display: flex; flex-direction: column; overflow: hidden; position: relative; }
    #events { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .jump {
      position: absolute; right: 22px; bottom: 18px; z-index: 5;
      display: flex; flex-direction: column; gap: 6px;
    }
    .jump button {
      width: 36px; height: 36px; border-radius: 980px;
      border: 0.5px solid var(--separator);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      color: var(--ink); font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .jump button:hover { background: #fff; }
    .jump button.on { background: var(--accent); color: #fff; border-color: transparent; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      cursor: pointer;
    }
    .card.active { outline: 2px solid rgba(0,113,227,0.35); }
    .card .id, .card .meta {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card .id { font-family: var(--font-mono); font-size: 12px; }
    .thread { flex: 1; overflow-x: hidden; overflow-y: auto; padding-right: 4px; }
    .row {
      display: flex; width: 100%; margin: 0 0 10px;
      min-width: 0;
    }
    .row.user { justify-content: flex-end; }
    .row.assistant, .row.tool { justify-content: flex-start; }
    .row.system { justify-content: center; }
    .bubble {
      max-width: min(640px, 78%);
      min-width: 0;
      width: fit-content;
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      overflow: hidden;
    }
    .bubble-body {
      max-height: min(280px, 38vh);
      overflow: auto;
      min-width: 0;
    }
    .bubble.user {
      background: var(--honey-soft);
      color: var(--user-ink);
      border-bottom-right-radius: 6px;
    }
    .bubble.assistant {
      background: var(--card);
      border-left: 3px solid var(--accent);
      border-bottom-left-radius: 6px;
    }
    .bubble.tool {
      background: var(--tool-soft);
      border-left: 3px solid var(--tool);
      max-width: min(820px, 94%);
    }
    .bubble.system {
      background: var(--system-soft);
      color: var(--system);
      border-radius: 980px;
      padding: 6px 12px;
      font-size: 12px;
      max-width: min(520px, 80%);
    }
    .who {
      font-size: 11px; font-weight: 650; letter-spacing: 0.02em;
      margin-bottom: 4px; opacity: 0.85;
    }
    .bubble.user .who { color: var(--honey); text-align: right; }
    .bubble.assistant .who { color: var(--accent); }
    .bubble.tool .who { color: var(--tool); }
    .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 980px;
      background: var(--honey-soft); color: var(--honey);
    }
    .bubble pre, .bubble code, .bubble .hljs, .bubble .md-preview, .bubble .kv {
      max-width: 100%; min-width: 0;
    }
    .bubble pre, .bubble pre.hljs, .bubble .hljs, .bubble .hljs code, .bubble code {
      font-family: var(--font-mono) !important;
      font-size: 12px;
      white-space: pre-wrap !important;
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
      margin-top: 6px;
      color: #333;
      overflow-x: hidden !important;
    }
    .kv { margin-top: 8px; }
    .kv .k {
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .kv pre { margin-top: 3px; }
    details.raw {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    details.raw summary { cursor: pointer; user-select: none; }
    .empty { color: var(--muted); padding: 24px 8px; }
    .md-preview { font-size: 14px; line-height: 1.5; color: var(--ink); }
    .md-preview > :first-child { margin-top: 0; }
    .md-preview > :last-child { margin-bottom: 0; }
    .md-preview h1, .md-preview h2, .md-preview h3,
    .md-preview h4, .md-preview h5, .md-preview h6 {
      font-weight: 650; letter-spacing: -0.02em; margin: 0.85em 0 0.35em;
    }
    .md-preview h1 { font-size: 1.28em; }
    .md-preview h2 { font-size: 1.14em; }
    .md-preview h3 { font-size: 1.05em; }
    .md-preview p { margin: 0 0 0.6em; }
    .md-preview ul, .md-preview ol { margin: 0.15em 0 0.65em; padding-left: 1.3em; }
    .md-preview li { margin: 0.12em 0; }
    .md-preview blockquote {
      margin: 0.4em 0 0.7em; padding: 0 0 0 10px;
      border-left: 3px solid rgba(196,122,44,0.35); color: var(--muted);
    }
    .md-preview code {
      font-family: var(--font-mono); font-size: 12.5px;
      background: rgba(120,120,128,0.12); padding: 0.08em 0.35em; border-radius: 5px;
      white-space: pre-wrap !important; overflow-wrap: anywhere !important;
    }
    .md-preview pre {
      background: #f6f8fa; border-radius: 10px; padding: 10px 12px;
      overflow: auto; max-height: 28em;
    }
    .md-preview pre code { background: transparent; padding: 0; }
    .kv .hljs, .kv pre.hljs {
      margin-top: 4px; border-radius: 10px; padding: 10px 12px;
      overflow: auto; max-height: 28em;
    }
    .url-inert.md-link { color: var(--accent); }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .list { border-right: 0; border-bottom: 0.5px solid var(--separator); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ClipVault · Trae 会话</h1>
      <div class="sub" id="health">加载中…</div>
    </div>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="搜 prompt / 工具 / 原文" />
    <a class="back" href="http://127.0.0.1:8080/">回剪贴板</a>
  </header>
  <main>
    <section class="list" id="sessions"><div class="empty">暂无会话</div></section>
    <section class="detail">
      <div id="events"><div class="empty">选择左侧会话</div></div>
      <div class="jump">
        <button type="button" id="jumpTop" title="滑到顶部">顶</button>
        <button type="button" id="jumpBot" title="滑到底部并跟踪">底</button>
      </div>
    </section>
  </main>
  <script type="module">
    import { imMessagesFromEvents, prettyJson, renderEventBlocks, renderValue } from "/session-render.mjs";

    const $ = (id) => document.getElementById(id);
    let current = "";
    let painted = "";
    let followTail = true;
    let lastSig = "";
    const NEAR = 48;
    const threadEl = () => $("events").querySelector(".thread");
    const nearBottom = (el) =>
      !el || el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR;
    const scrollThread = (where) => {
      const el = threadEl();
      if (!el) return;
      el.scrollTop = where === "top" ? 0 : el.scrollHeight;
    };
    const markFollow = (on) => {
      followTail = on;
      $("jumpBot").classList.toggle("on", on);
    };
    const bindThreadScroll = () => {
      const el = threadEl();
      if (!el || el.dataset.bound) return;
      el.dataset.bound = "1";
      el.addEventListener("scroll", () => {
        markFollow(nearBottom(el));
      }, { passive: true });
    };
    const engines = () => ({
      marked: globalThis.marked,
      purify: globalThis.DOMPurify,
      hljs: globalThis.hljs,
      jsBeautify: globalThis.js_beautify,
    });
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    async function loadHealth() {
      try {
        const h = await (await fetch("/api/health")).json();
        $("health").textContent = `events ${h.events ?? 0} · last ${h.last_ts || "—"} · duckdb ${h.duckdb}`;
      } catch (e) {
        $("health").textContent = "store 未就绪";
      }
    }
    async function loadSessions() {
      const data = await (await fetch("/api/sessions?limit=80")).json();
      const box = $("sessions");
      if (!data.sessions || !data.sessions.length) {
        box.innerHTML = '<div class="empty">还没有 hook 事件。装好 hooks.json 后硬重启 Trae，再发一条真实消息。</div>';
        return;
      }
      box.innerHTML = data.sessions.map((s) => `
        <div class="card${s.session_id === current ? " active" : ""}" data-id="${s.session_id || ""}">
          <div class="id">${s.session_id || "(no session)"}</div>
          <div class="meta">${s.event_count} 事件 · ${s.last_ts || ""}</div>
          <div class="meta">${s.cwd || ""}</div>
        </div>`).join("");
      box.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("click", () => {
          current = el.getAttribute("data-id") || "";
          lastSig = "";
          markFollow(true);
          loadEvents();
          loadSessions();
        });
      });
    }
    async function loadEvents() {
      const q = $("q").value.trim();
      const params = new URLSearchParams({ limit: "200" });
      if (current) params.set("session_id", current);
      if (q) params.set("q", q);
      const data = await (await fetch("/api/events?" + params)).json();
      const box = $("events");
      if (!data.events || !data.events.length) {
        box.innerHTML = '<div class="empty">没有匹配事件</div>';
        return;
      }
      const rows = imMessagesFromEvents(data.events);
      const sig = rows.map((r) => r.event.event_id).join(",");
      const unchanged = sig === lastSig && threadEl();
      lastSig = sig;
      if (unchanged) {
        if (followTail) scrollThread("bottom");
        return;
      }
      box.innerHTML = `<div class="thread">${rows.map((row) => {
        const e = row.event;
        const tools = [e.tool_name, e.llm_tool_name].filter(Boolean).join(" / ");
        const meta = [e.ts, e.hook_event, tools].filter(Boolean).join(" · ");
        const body = renderEventBlocks(e, engines()).map((b) =>
          `<div class="kv">${b.html}</div>`
        ).join("");
        return `<div class="row ${esc(row.role)}">
          <article class="bubble ${esc(row.role)}" data-id="${esc(e.event_id)}">
            <div class="who">${esc(row.label)}</div>
            <div class="bubble-body">${body}</div>
            <div class="meta">${esc(meta)}</div>
            <details class="raw">
              <summary>原始 JSON</summary>
              <div class="raw-body">加载中…</div>
            </details>
          </article>
        </div>`;
      }).join("")}</div>`;
      bindThreadScroll();
      if (followTail || painted !== current) scrollThread("bottom");
      painted = current;
      box.querySelectorAll("details.raw").forEach((el) => {
        el.addEventListener("toggle", async () => {
          if (!el.open) return;
          const host = el.querySelector(".raw-body");
          if (host.dataset.loaded) return;
          const id = el.closest(".bubble").getAttribute("data-id");
          try {
            const d = await (await fetch("/api/event?id=" + encodeURIComponent(id))).json();
            const raw = d.event && d.event.raw_json ? d.event.raw_json : prettyJson(d.event);
            host.innerHTML = renderValue(raw, "json", engines()).html;
            host.dataset.loaded = "1";
          } catch (err) {
            host.textContent = String(err);
          }
        });
      });
    }
    $("q").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadEvents();
    });
    $("jumpTop").addEventListener("click", () => {
      markFollow(false);
      scrollThread("top");
    });
    $("jumpBot").addEventListener("click", () => {
      markFollow(true);
      scrollThread("bottom");
    });
    markFollow(true);
    loadHealth();
    loadSessions();
    setInterval(() => { loadHealth(); if (current) loadEvents(); else loadSessions(); }, 8000);
  </script>
</body>
</html>
