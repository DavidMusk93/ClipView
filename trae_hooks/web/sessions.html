<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话 · ClipVault</title>
  <meta name="color-scheme" content="light" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --rail: #f2f2f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --separator: rgba(60, 60, 67, 0.12);
      --card: #ffffff;
      --accent: #0071e3;
      --honey: #c47a2c;
      --honey-soft: rgba(196, 122, 44, 0.14);
      --user-ink: #6b3f0e;
      --tool: #1565c0;
      --tool-soft: rgba(21, 101, 192, 0.10);
      --system: #8e8e93;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .top {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 16px 0 18px;
      background: rgba(245, 245, 247, 0.72);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-bottom: 0.5px solid var(--separator);
      z-index: 4;
    }
    h1 {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .grow { flex: 1; }
    a.back {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .app {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      overflow: hidden;
    }
    .rail {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--rail);
      border-right: 0.5px solid var(--separator);
    }
    .rail-search { flex: 0 0 auto; padding: 10px 10px 8px; }
    #sessionList {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 8px 28px;
    }
    input[type="search"] {
      width: 100%;
      border: 0;
      background: rgba(120, 120, 128, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
    }
    input:focus { outline: none; background: #fff; }
    .card {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 0;
    }
    .card.active { background: rgba(0, 0, 0, 0.06); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { background: rgba(0, 0, 0, 0.04); }
    }
    .card .title {
      font-size: 14px;
      font-weight: 590;
      letter-spacing: -0.015em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card .meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .id-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .stage {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(900px 280px at 100% -10%, rgba(196, 122, 44, 0.06), transparent 50%),
        #fafafa;
      position: relative;
    }
    .session-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: 48px;
      padding: 0 18px;
      background: rgba(250, 250, 250, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 0.5px solid var(--separator);
    }
    .session-head[hidden] { display: none !important; }
    .session-head .sid {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 590;
      letter-spacing: -0.02em;
    }
    .copy-id {
      flex-shrink: 0;
      height: 24px;
      padding: 0 10px;
      border: 0;
      border-radius: 980px;
      background: rgba(120, 120, 128, 0.12);
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 100ms ease-out, color 100ms ease-out, transform 100ms ease-out;
    }
    .copy-id:active { transform: scale(0.97); }
    .copy-id.ok { background: var(--honey-soft); color: var(--honey); }
    @media (hover: hover) and (pointer: fine) {
      .copy-id:hover { background: rgba(120, 120, 128, 0.18); color: var(--ink); }
    }
    .thread {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 22px 72px;
    }
    .day {
      display: flex;
      justify-content: center;
      margin: 8px 0 16px;
    }
    .day span {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(120, 120, 128, 0.12);
      padding: 3px 10px;
      border-radius: 980px;
    }
    .row {
      display: flex;
      width: 100%;
      margin: 0 0 10px;
      min-width: 0;
    }
    .row.grouped { margin-top: -4px; }
    .row.user { justify-content: flex-end; }
    .row.assistant, .row.tool { justify-content: flex-start; }
    .row.system { justify-content: center; }
    .bubble {
      max-width: min(560px, 76%);
      min-width: 0;
      width: fit-content;
      border-radius: 18px;
      padding: 9px 13px 10px;
      overflow: hidden;
    }
    .bubble.user {
      background: var(--honey-soft);
      color: var(--user-ink);
      border-bottom-right-radius: 5px;
    }
    .bubble.assistant {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      border-bottom-left-radius: 5px;
    }
    .bubble.tool {
      max-width: min(720px, 92%);
      background: var(--card);
      border: 0.5px solid var(--separator);
      border-radius: 14px;
      padding: 0;
      box-shadow: none;
    }
    .bubble.system {
      background: transparent;
      box-shadow: none;
      padding: 0;
      max-width: min(420px, 86%);
    }
    .bubble.system .who,
    .row.grouped .who { display: none; }
    .who {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      opacity: 0.8;
    }
    .bubble.assistant .who { color: var(--accent); }
    .bubble.tool .who { color: var(--tool); }
    .bubble-body { min-width: 0; }
    .bubble.tool .bubble-body {
      max-height: min(240px, 32vh);
      overflow: auto;
      padding: 0 12px 10px;
    }
    .meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }
    .bubble.tool .meta { padding: 0 12px 10px; margin-top: 0; }
    .tool-fold summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      user-select: none;
    }
    .tool-fold summary::-webkit-details-marker { display: none; }
    .tool-fold .tool-name {
      font-size: 12px;
      font-weight: 650;
      color: var(--tool);
    }
    .tool-fold .tool-result {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
    }
    .tool-fold[open] summary {
      border-bottom: 0.5px solid var(--separator);
    }
    .empty { color: var(--muted); padding: 48px 12px; text-align: center; font-size: 14px; }
    .follow {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 980px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
    }
    .follow[hidden] { display: none !important; }
    .follow:active { transform: scale(0.97); }
    .follow.has-new { background: var(--accent); color: #fff; }
    .bubble pre, .bubble code, .bubble .hljs, .bubble .md-preview, .bubble .kv {
      max-width: 100%; min-width: 0;
    }
    .bubble pre, .bubble pre.hljs, .bubble .hljs, .bubble .hljs code, .bubble code {
      font-family: var(--font-mono) !important;
      font-size: 12px;
      white-space: pre-wrap !important;
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
      margin-top: 6px;
      color: #333;
      overflow-x: hidden !important;
    }
    .kv { margin-top: 8px; }
    .kv .k {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .kv pre { margin-top: 3px; }
    details.raw {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .bubble.tool details.raw { margin: 0 12px 10px; }
    details.raw summary { cursor: pointer; user-select: none; }
    .md-preview { font-size: 15px; line-height: 1.47; letter-spacing: -0.011em; color: var(--ink); }
    .md-preview > :first-child { margin-top: 0; }
    .md-preview > :last-child { margin-bottom: 0; }
    .md-preview h1, .md-preview h2, .md-preview h3,
    .md-preview h4, .md-preview h5, .md-preview h6 {
      font-weight: 650; letter-spacing: -0.02em; margin: 0.85em 0 0.35em;
    }
    .md-preview p { margin: 0 0 0.55em; }
    .md-preview ul, .md-preview ol { margin: 0.15em 0 0.55em; padding-left: 1.25em; }
    .md-preview li { margin: 0.1em 0; }
    .md-preview blockquote {
      margin: 0.4em 0 0.6em; padding: 0 0 0 10px;
      border-left: 3px solid rgba(196, 122, 44, 0.35); color: var(--muted);
    }
    .md-preview code {
      font-family: var(--font-mono); font-size: 12.5px;
      background: rgba(120, 120, 128, 0.12); padding: 0.08em 0.35em; border-radius: 5px;
      white-space: pre-wrap !important; overflow-wrap: anywhere !important;
    }
    .md-preview pre {
      background: #f5f5f7; border-radius: 10px; padding: 10px 12px;
      overflow: auto; max-height: 22em;
    }
    .md-preview pre code { background: transparent; padding: 0; }
    .kv .hljs, .kv pre.hljs {
      margin-top: 4px; border-radius: 10px; padding: 10px 12px;
      overflow: auto; max-height: 22em;
    }
    .url-inert.md-link { color: var(--accent); }
    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(132px, 30vh) minmax(0, 1fr);
      }
      .rail { border-right: 0; border-bottom: 0.5px solid var(--separator); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card:active, .copy-id:active, .follow:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>会话</h1>
      <div class="sub" id="health">加载中…</div>
    </div>
    <div class="grow"></div>
    <a class="back" href="http://127.0.0.1:8080/">回剪贴板</a>
  </header>
  <div class="app">
    <aside class="rail">
      <div class="rail-search"><input type="search" id="q" placeholder="搜 prompt / 工具" /></div>
      <div id="sessionList"><div class="empty">暂无会话</div></div>
    </aside>
    <section class="stage">
      <div class="session-head" id="sessionHead" hidden>
        <span class="sid" id="sessionSid"></span>
        <button type="button" class="copy-id" id="copySid" title="复制 session id" aria-label="复制 session id">复制</button>
      </div>
      <div class="thread" id="thread"><div class="empty">选择左侧会话</div></div>
      <button type="button" class="follow" id="jumpBot" hidden title="回到最新" aria-label="回到最新并跟踪">↓</button>
    </section>
  </div>
  <script type="module">
    import { asObj, imMessagesFromEvents, prettyJson, renderEventBlocks, renderValue } from "/session-render.mjs";

    const $ = (id) => document.getElementById(id);
    const thread = $("thread");
    const jumpBot = $("jumpBot");
    let current = "";
    let painted = "";
    let followTail = true;
    let pendingNew = false;
    let lastSig = "";
    let railY = 0;
    const NEAR = 64;

    const nearBottom = (el) =>
      !el || el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR;
    const pinBottom = () => {
      thread.scrollTop = thread.scrollHeight;
    };
    const pinBottomSoon = () => {
      pinBottom();
      requestAnimationFrame(() => {
        pinBottom();
        requestAnimationFrame(pinBottom);
      });
    };
    const syncFollowBtn = () => {
      jumpBot.hidden = followTail;
      jumpBot.classList.toggle("has-new", pendingNew && !followTail);
    };
    const markFollow = (on) => {
      followTail = on;
      if (on) pendingNew = false;
      syncFollowBtn();
    };
    thread.addEventListener("scroll", () => {
      markFollow(nearBottom(thread));
    }, { passive: true });

    const engines = () => ({
      marked: globalThis.marked,
      purify: globalThis.DOMPurify,
      hljs: globalThis.hljs,
      jsBeautify: globalThis.js_beautify,
    });
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const copyTimers = new WeakMap();
    const flashCopy = (btn, ok) => {
      if (!btn) return;
      const prev = copyTimers.get(btn);
      if (prev) window.clearTimeout(prev);
      btn.classList.toggle("ok", ok);
      btn.textContent = ok ? "已复制" : "失败";
      const t = window.setTimeout(() => {
        btn.classList.remove("ok");
        btn.textContent = "复制";
        copyTimers.delete(btn);
      }, 900);
      copyTimers.set(btn, t);
    };
    const copySessionId = async (id, btn) => {
      const sid = String(id || "").trim();
      if (!sid) return false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(sid);
        } else {
          const ta = document.createElement("textarea");
          ta.value = sid;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        flashCopy(btn, true);
        return true;
      } catch (_) {
        flashCopy(btn, false);
        return false;
      }
    };
    const showSessionHead = (sid, title) => {
      const head = $("sessionHead");
      if (!sid) {
        head.hidden = true;
        $("sessionSid").textContent = "";
        return;
      }
      head.hidden = false;
      $("sessionSid").textContent = title || sid;
      $("sessionSid").title = sid;
    };
    const bindCopyButtons = (root) => {
      root.querySelectorAll("[data-copy-sid]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          copySessionId(btn.getAttribute("data-copy-sid") || "", btn);
        });
      });
    };

    const dayKey = (ts) => {
      const raw = String(ts || "").replace(" ", "T");
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return String(ts || "").slice(0, 10);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };
    const dayLabel = (key) => {
      const now = new Date();
      const today = dayKey(now.toISOString());
      const y = new Date(now);
      y.setDate(y.getDate() - 1);
      if (key === today) return "今天";
      if (key === dayKey(y.toISOString())) return "昨天";
      return key.replace(/-/g, "/");
    };
    const relTime = (ts) => {
      const d = new Date(String(ts || "").replace(" ", "T"));
      if (Number.isNaN(d.getTime())) return ts || "";
      const sec = (Date.now() - d.getTime()) / 1000;
      if (sec < 45) return "刚刚";
      if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
      if (sec < 86400) return `${Math.floor(sec / 3600)} 小时前`;
      if (sec < 86400 * 7) return `${Math.floor(sec / 86400)} 天前`;
      return dayLabel(dayKey(ts));
    };
    const sessionTitle = (s) => {
      const p = String(s.last_prompt || "").trim().split(/\n/)[0];
      if (p) return p.slice(0, 56);
      const cwd = String(s.cwd || "").replace(/\/$/, "");
      const base = cwd.split("/").filter(Boolean).pop();
      if (base) return base;
      const id = String(s.session_id || "");
      return id ? `${id.slice(0, 10)}…` : "无会话";
    };
    const toolBits = (e) => {
      const resp = asObj(e.tool_response) || {};
      const bits = [];
      if (resp.exit_code != null) bits.push("exit " + resp.exit_code);
      if (resp.status) bits.push(String(resp.status));
      if (resp.wall_time_seconds != null) bits.push(resp.wall_time_seconds + "s");
      return bits.join(" · ");
    };

    function renderRows(rows, prev) {
      let lastDay = prev ? dayKey(prev.event.ts) : "";
      let lastRole = prev ? prev.role : "";
      return rows.map((row) => {
        const e = row.event;
        const day = dayKey(e.ts);
        const grouped = lastRole === row.role && row.role !== "system" && day === lastDay;
        const chip = day && day !== lastDay
          ? `<div class="day"><span>${esc(dayLabel(day))}</span></div>`
          : "";
        lastDay = day;
        lastRole = row.role;
        const tools = [e.tool_name, e.llm_tool_name].filter(Boolean).join(" / ");
        const meta = [relTime(e.ts), e.hook_event, tools].filter(Boolean).join(" · ");
        const body = renderEventBlocks(e, engines()).map((b) =>
          `<div class="kv">${b.key === "result" ? "" : `<div class="k">${esc(b.key)}</div>`}${b.html}</div>`
        ).join("");
        const who = grouped ? "" : `<div class="who">${esc(row.label)}</div>`;
        let inner;
        if (row.role === "tool") {
          const name = tools || "工具";
          const result = toolBits(e);
          inner = `<details class="tool-fold">
            <summary>
              <span class="tool-name">${esc(name)}</span>
              <span class="tool-result">${esc(result)}</span>
            </summary>
            ${who}
            <div class="bubble-body">${body}</div>
            <div class="meta">${esc(meta)}</div>
            <details class="raw">
              <summary>原始 JSON</summary>
              <div class="raw-body">加载中…</div>
            </details>
          </details>`;
        } else if (row.role === "system") {
          inner = `<div class="bubble-body">${body || esc(e.hook_event || "")}</div>`;
        } else {
          inner = `${who}<div class="bubble-body">${body}</div>
            <div class="meta">${esc(meta)}</div>
            <details class="raw">
              <summary>原始 JSON</summary>
              <div class="raw-body">加载中…</div>
            </details>`;
        }
        return `${chip}<div class="row ${esc(row.role)}${grouped ? " grouped" : ""}">
          <article class="bubble ${esc(row.role)}" data-id="${esc(e.event_id)}">${inner}</article>
        </div>`;
      }).join("");
    }

    function bindRaws(root) {
      root.querySelectorAll("details.raw").forEach((el) => {
        if (el.dataset.bound) return;
        el.dataset.bound = "1";
        el.addEventListener("toggle", async () => {
          if (!el.open) return;
          const host = el.querySelector(".raw-body");
          if (!host || host.dataset.loaded) return;
          const id = el.closest(".bubble").getAttribute("data-id");
          try {
            const d = await (await fetch("/api/event?id=" + encodeURIComponent(id))).json();
            const raw = d.event && d.event.raw_json ? d.event.raw_json : prettyJson(d.event);
            host.innerHTML = renderValue(raw, "json", engines()).html;
            host.dataset.loaded = "1";
          } catch (err) {
            host.textContent = String(err);
          }
        });
      });
    }

    async function loadHealth() {
      try {
        const h = await (await fetch("/api/health")).json();
        $("health").textContent = `${h.events ?? 0} 条 · ${relTime(h.last_ts) || "—"}`;
      } catch (e) {
        $("health").textContent = "store 未就绪";
      }
    }
    async function loadSessions() {
      const data = await (await fetch("/api/sessions?limit=80")).json();
      const box = $("sessionList");
      railY = box.scrollTop;
      if (!data.sessions || !data.sessions.length) {
        box.innerHTML = '<div class="empty">还没有 hook 事件。装好 hooks 后硬重启 Trae，再发一条真实消息。</div>';
        return;
      }
      box.innerHTML = data.sessions.map((s) => {
        const title = sessionTitle(s);
        return `
        <div class="card${s.session_id === current ? " active" : ""}" data-id="${esc(s.session_id || "")}" data-title="${esc(title)}">
          <div class="id-row">
            <div class="title" title="${esc(s.session_id || "")}">${esc(title)}</div>
            ${s.session_id ? `<button type="button" class="copy-id" data-copy-sid="${esc(s.session_id)}" title="复制 session id" aria-label="复制 session id">复制</button>` : ""}
          </div>
          <div class="meta">${relTime(s.last_ts)} · ${s.event_count} 条</div>
        </div>`;
      }).join("");
      box.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("click", () => {
          current = el.getAttribute("data-id") || "";
          lastSig = "";
          painted = "";
          markFollow(true);
          showSessionHead(current, el.getAttribute("data-title") || current);
          loadEvents();
          loadSessions();
        });
      });
      bindCopyButtons(box);
      box.scrollTop = railY;
    }
    async function loadEvents() {
      const q = (document.getElementById("q") || {}).value || "";
      const params = new URLSearchParams({ limit: "200" });
      if (current) params.set("session_id", current);
      if (String(q).trim()) params.set("q", String(q).trim());
      if (!current) {
        thread.innerHTML = '<div class="empty">选择左侧会话</div>';
        showSessionHead("");
        return;
      }
      const data = await (await fetch("/api/events?" + params)).json();
      if (!data.events || !data.events.length) {
        thread.innerHTML = '<div class="empty">没有匹配事件</div>';
        lastSig = "";
        return;
      }
      const rows = imMessagesFromEvents(data.events);
      const sig = rows.map((r) => r.event.event_id).join(",");
      if (sig === lastSig) {
        if (followTail) pinBottomSoon();
        return;
      }
      const canAppend = lastSig && sig.startsWith(lastSig + ",") && thread.querySelector(".row");
      if (canAppend) {
        const oldN = lastSig.split(",").filter(Boolean).length;
        const added = rows.slice(oldN);
        const prev = rows[oldN - 1];
        thread.insertAdjacentHTML("beforeend", renderRows(added, prev));
        lastSig = sig;
        bindRaws(thread);
        if (followTail) pinBottomSoon();
        else {
          pendingNew = true;
          syncFollowBtn();
        }
        return;
      }
      lastSig = sig;
      thread.innerHTML = renderRows(rows);
      bindRaws(thread);
      if (followTail || painted !== current) pinBottomSoon();
      painted = current;
    }

    $("q").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadEvents();
    });
    jumpBot.addEventListener("click", () => {
      markFollow(true);
      pinBottomSoon();
    });
    $("copySid").addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      copySessionId(current, $("copySid"));
    });
    markFollow(true);
    loadHealth();
    loadSessions();
    const tick = () => {
      loadHealth();
      if (current) loadEvents();
      loadSessions();
    };
    setInterval(tick, 2500);
  </script>
</body>
</html>
