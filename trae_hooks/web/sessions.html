<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipVault · Trae 会话</title>
  <meta name="color-scheme" content="light" />
  <style>
    :root {
      --bg: #f5f5f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --separator: rgba(60, 60, 67, 0.12);
      --card: #ffffff;
      --accent: #0071e3;
      --honey: #c47a2c;
      --radius: 16px;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(196, 146, 66, 0.10), transparent 55%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 22px;
      background: rgba(245,245,247,0.78);
      backdrop-filter: blur(18px);
      border-bottom: 0.5px solid var(--separator);
    }
    h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; }
    .grow { flex: 1; }
    input[type="search"] {
      width: min(360px, 42vw);
      border: 0.5px solid transparent;
      background: rgba(120,120,128,0.12);
      border-radius: 980px;
      padding: 8px 14px;
      font: inherit;
    }
    input:focus { outline: none; background: #fff; border-color: rgba(0,113,227,0.35); }
    a.back {
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
    }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 58px); }
    .list, .detail { padding: 16px 18px; }
    .list { border-right: 0.5px solid var(--separator); }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      cursor: pointer;
    }
    .card.active { outline: 2px solid rgba(0,113,227,0.35); }
    .card .id { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .ev {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 980px;
      background: rgba(196,122,44,0.12); color: var(--honey);
    }
    .badge.tool { background: rgba(21,101,192,0.12); color: #1565c0; }
    .badge.stop { background: rgba(46,125,50,0.12); color: #2e7d32; }
    .badge.warn { background: rgba(178,80,0,0.12); color: #b25000; }
    pre {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
      color: #333;
    }
    .kv { margin-top: 8px; }
    .kv .k {
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .kv pre { margin-top: 3px; }
    details.raw {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    details.raw summary { cursor: pointer; user-select: none; }
    .empty { color: var(--muted); padding: 24px 8px; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .list { border-right: 0; border-bottom: 0.5px solid var(--separator); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ClipVault · Trae 会话</h1>
      <div class="sub" id="health">加载中…</div>
    </div>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="搜 prompt / 工具 / 原文" />
    <a class="back" href="http://127.0.0.1:8080/">回剪贴板</a>
  </header>
  <main>
    <section class="list" id="sessions"><div class="empty">暂无会话</div></section>
    <section class="detail" id="events"><div class="empty">选择左侧会话</div></section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let current = "";
    const badgeClass = (name) => {
      if (name === "PreToolUse" || name === "PostToolUse") return "tool";
      if (name === "Stop") return "stop";
      if (name === "UserPromptSubmit") return "warn";
      return "";
    };
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const asObj = (v) => {
      if (v == null || v === "") return null;
      if (typeof v === "object") return v;
      try { return JSON.parse(v); } catch { return null; }
    };
    const pretty = (v) => {
      if (v == null || v === "") return "";
      if (typeof v === "string") {
        const o = asObj(v);
        return o ? JSON.stringify(o, null, 2) : v;
      }
      return JSON.stringify(v, null, 2);
    };
    const toolCmd = (input) => {
      const o = asObj(input) || {};
      return o.cmd || o.command || o.command_line || "";
    };
    const eventBody = (e) => {
      const blocks = [];
      const input = asObj(e.tool_input);
      const resp = asObj(e.tool_response);
      const cmd = toolCmd(e.tool_input);
      if (e.prompt) blocks.push(["prompt", e.prompt]);
      if (e.last_assistant_message) blocks.push(["assistant", e.last_assistant_message]);
      if (e.notification_message) blocks.push(["message", e.notification_message]);
      if (cmd) blocks.push(["command", cmd]);
      else if (e.tool_input) blocks.push(["tool_input", pretty(e.tool_input)]);
      if (resp) {
        const bits = [];
        if (resp.exit_code != null) bits.push("exit " + resp.exit_code);
        if (resp.status) bits.push(resp.status);
        if (resp.wall_time_seconds != null) bits.push(resp.wall_time_seconds + "s");
        const out = resp.output || resp.stdout || resp.stderr || "";
        const head = bits.join(" · ");
        if (head) blocks.push(["result", head]);
        if (out) blocks.push(["output", out]);
        const rest = { ...resp };
        delete rest.output; delete rest.stdout; delete rest.stderr;
        delete rest.exit_code; delete rest.status; delete rest.wall_time_seconds;
        if (Object.keys(rest).length) blocks.push(["tool_response", pretty(rest)]);
      } else if (e.tool_response) {
        blocks.push(["tool_response", pretty(e.tool_response)]);
      }
      if (!blocks.length && e.cwd) blocks.push(["cwd", e.cwd]);
      return blocks;
    };
    async function loadHealth() {
      try {
        const h = await (await fetch("/api/health")).json();
        $("health").textContent = `events ${h.events ?? 0} · last ${h.last_ts || "—"} · duckdb ${h.duckdb}`;
      } catch (e) {
        $("health").textContent = "store 未就绪";
      }
    }
    async function loadSessions() {
      const data = await (await fetch("/api/sessions?limit=80")).json();
      const box = $("sessions");
      if (!data.sessions || !data.sessions.length) {
        box.innerHTML = '<div class="empty">还没有 hook 事件。装好 hooks.json 后硬重启 Trae，再发一条真实消息。</div>';
        return;
      }
      box.innerHTML = data.sessions.map((s) => `
        <div class="card${s.session_id === current ? " active" : ""}" data-id="${s.session_id || ""}">
          <div class="id">${s.session_id || "(no session)"}</div>
          <div class="meta">${s.event_count} 事件 · ${s.last_ts || ""}</div>
          <div class="meta">${s.cwd || ""}</div>
        </div>`).join("");
      box.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("click", () => {
          current = el.getAttribute("data-id") || "";
          loadEvents();
          loadSessions();
        });
      });
    }
    async function loadEvents() {
      const q = $("q").value.trim();
      const params = new URLSearchParams({ limit: "200" });
      if (current) params.set("session_id", current);
      if (q) params.set("q", q);
      const data = await (await fetch("/api/events?" + params)).json();
      const box = $("events");
      if (!data.events || !data.events.length) {
        box.innerHTML = '<div class="empty">没有匹配事件</div>';
        return;
      }
      box.innerHTML = data.events.map((e) => {
        const tools = [e.tool_name, e.llm_tool_name].filter(Boolean).join(" / ");
        const meta = [e.ts, tools, e.instance_id, e.cwd].filter(Boolean).join(" · ");
        const body = eventBody(e).map(([k, v]) =>
          `<div class="kv"><div class="k">${esc(k)}</div><pre>${esc(v)}</pre></div>`
        ).join("");
        return `<article class="ev" data-id="${esc(e.event_id)}">
          <span class="badge ${badgeClass(e.hook_event)}">${esc(e.hook_event)}</span>
          <span class="meta">${esc(meta)}</span>
          ${body}
          <details class="raw">
            <summary>原始 JSON</summary>
            <pre class="raw-body">加载中…</pre>
          </details>
        </article>`;
      }).join("");
      box.querySelectorAll("details.raw").forEach((el) => {
        el.addEventListener("toggle", async () => {
          if (!el.open) return;
          const pre = el.querySelector(".raw-body");
          if (pre.dataset.loaded) return;
          const id = el.closest(".ev").getAttribute("data-id");
          try {
            const d = await (await fetch("/api/event?id=" + encodeURIComponent(id))).json();
            pre.textContent = pretty(d.event && d.event.raw_json ? d.event.raw_json : d.event);
            pre.dataset.loaded = "1";
          } catch (err) {
            pre.textContent = String(err);
          }
        });
      });
    }
    $("q").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadEvents();
    });
    loadHealth();
    loadSessions();
    setInterval(() => { loadHealth(); if (current) loadEvents(); else loadSessions(); }, 4000);
  </script>
</body>
</html>
