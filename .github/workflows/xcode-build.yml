name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary product: headless ClipFlowServer (Package.swift)
  swift-build:
    name: Swift · ClipFlowServer
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          node --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'ClipFlow/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (debug)
        run: swift build --product ClipFlowServer

      - name: Build (release)
        run: swift build -c release --product ClipFlowServer

      - name: Verify binary
        run: |
          BIN=".build/release/ClipFlowServer"
          test -x "$BIN"
          ls -lh "$BIN"
          # Sanity: linked binary exists and is Mach-O arm64/x86_64
          file "$BIN"

  frontend-tests:
    name: Web · masonry unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run masonry regression tests
        run: node --test tests/masonry.test.mjs

  # Optional: keep App target buildable when xcodeproj is healthy.
  # Disabled by default — project is SPM-first; enable when ClipFlow.xcodeproj is refreshed.
  # xcode-app:
  #   name: Xcode · ClipFlow (optional)
  #   if: false
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: |
  #         xcodebuild build \
  #           -project ClipFlow.xcodeproj \
  #           -scheme ClipFlow \
  #           -destination "platform=macOS" \
  #           CODE_SIGNING_ALLOWED=NO
