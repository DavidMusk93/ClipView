name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary product: headless ClipFlowServer (Package.swift)
  swift-build:
    name: Swift · ClipFlowServer
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          node --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'ClipFlow/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (debug)
        run: swift build --product ClipFlowServer

      - name: Build (release)
        run: swift build -c release --product ClipFlowServer

      - name: Verify binary
        run: |
          BIN=".build/release/ClipFlowServer"
          test -x "$BIN"
          ls -lh "$BIN"
          # Sanity: linked binary exists and is Mach-O arm64/x86_64
          file "$BIN"

  frontend-tests:
    name: Web · unit regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run masonry regression tests
        run: node --test tests/masonry.test.mjs tests/pagination.test.mjs tests/notes-render.test.mjs

  # Android lives under android/; dedicated APK publish workflow also runs on path filters.
  # Keep a lightweight compile on full CI so monorepo PRs don't ship broken Gradle.
  android-apk:
    name: Android · assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-ci-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ci-

      - name: Assemble release APK
        env:
          KEEPSAKE_VERSION_NAME: 0.1.0-ci
          KEEPSAKE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: keepsake-android-ci-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
