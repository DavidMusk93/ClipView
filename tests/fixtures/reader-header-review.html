<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>header align review</title>
  <style>
    html, body { margin: 0; background: #ddd; }
    .cv-note {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      width: 420px; margin: 40px auto; padding: 10px 12px;
      background: #fff; border-radius: 14px; color: #1d1d1f;
    }
    .cv-note-head { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; column-gap: 10px; min-height: 28px; position: relative; }
    .cv-note-lead { display: flex; align-items: center; gap: 7px; min-width: 0; height: 28px; }
    .cv-note-head strong { display: inline-flex; align-items: center; height: 28px; font-size: 13px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
    .cv-quote-bar { width: 2px; height: 12px; border-radius: 1px; background: #ffd60a; flex-shrink: 0; }
    .cv-quote { display: inline-flex; align-items: center; height: 28px; font-size: 13px; line-height: 1; color: #6e6e73; margin: 0; }
    .cv-note-tools { display: flex; align-items: center; gap: 6px; height: 28px; }
    .cv-mini { appearance: none; border: 0; height: 28px; padding: 0 11px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 13px; font-weight: 590; line-height: 1; }
    .cv-ghost { background: rgba(120,120,128,.12); }
    .cv-ok { background: #0071e3; color: #fff; }
    .guide { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #f00; pointer-events: none; }
  </style>
</head>
<body>
  <div class="cv-note">
    <div class="cv-note-head">
      <div class="cv-note-lead">
        <strong>评论</strong>
        <i class="cv-quote-bar"></i>
        <p class="cv-quote">语义边界</p>
      </div>
      <div class="cv-note-tools">
        <button class="cv-mini cv-ghost" type="button">取消</button>
        <button class="cv-mini cv-ok" type="button">提交</button>
      </div>
      <i class="guide"></i>
    </div>
  </div>
</body>
</html>
