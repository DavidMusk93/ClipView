<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ClipVault · 笔记</title>
  <link rel="icon" href="/assets/keepsake-logo.jpg?v=pose1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #86868b;
      --line: rgba(0,0,0,.08);
      --bg: #f5f5f7;
      --paper: #fff;
      --honey: #c47a2c;
      --accent: #0071e3;
      --rail: 292px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header.top {
      height: 56px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(245,245,247,.86);
      backdrop-filter: saturate(180%) blur(16px);
    }
    header.top a.back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink); text-decoration: none; font-weight: 600;
    }
    header.top a.back img { width: 28px; height: 28px; border-radius: 7px; }
    header.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.02em; }
    header.top .spacer { flex: 1; }
    header.top button {
      border: 0; background: var(--ink); color: #fff;
      border-radius: 10px; padding: 7px 12px; font: 13px/1.2 inherit;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    }
    .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail) 1fr; }
    .rail {
      border-right: 1px solid var(--line);
      background: var(--paper);
      min-width: 0; overflow: auto;
    }
    .rail-search {
      position: sticky; top: 0; background: var(--paper);
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .rail-search input {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; font: 13px/1.3 inherit; background: var(--bg);
    }
    .note-card {
      display: block; width: 100%; text-align: left;
      border: 0; border-bottom: 1px solid var(--line);
      background: transparent; padding: 12px 14px; cursor: pointer;
    }
    .note-card:hover { background: #fafafa; }
    .note-card.is-on { background: #fff7ee; box-shadow: inset 3px 0 0 var(--honey); }
    .note-card .t { font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
    .note-card .x { color: var(--muted); font-size: 12px; margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-card .m { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .empty-rail { padding: 28px 16px; color: var(--muted); font-size: 13px; }
    .stage { min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
    .stage-head {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 16px; border-bottom: 1px solid var(--line);
    }
    .stage-head input {
      flex: 1; border: 0; font: 600 18px/1.3 inherit; outline: none;
      letter-spacing: -.02em; background: transparent;
    }
    .stage-head .hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
    #editor { flex: 1; min-height: 0; }
    .vditor { border: 0 !important; }
    .vditor-toolbar { border-bottom: 1px solid var(--line) !important; background: #fafafa !important; }
    .vditor-reset { font-size: 16px !important; }
    .blank {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-direction: column; gap: 8px;
    }
    .blank strong { color: var(--ink); font-size: 18px; }
    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      .stage { display: none; }
      .workspace.is-editing .rail { display: none; }
      .workspace.is-editing .stage { display: flex; }
      .mobile-back { display: inline-flex !important; }
    }
    .mobile-back { display: none; border: 0; background: transparent; color: var(--accent); font: 13px inherit; cursor: pointer; }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="/"><img src="/assets/keepsake-logo.jpg?v=pose1" alt="" />ClipVault</a>
    <h1>笔记</h1>
    <div class="spacer"></div>
    <button type="button" id="newBtn"><span class="material-symbols-outlined" style="font-size:18px">edit_note</span>新一篇</button>
  </header>
  <div class="workspace" id="workspace">
    <aside class="rail">
      <div class="rail-search"><input id="q" type="search" placeholder="搜笔记…" autocomplete="off" /></div>
      <div id="list"></div>
    </aside>
    <section class="stage" id="stage">
      <div class="blank" id="blank">
        <strong>想到的写下</strong>
        <span>独立卡片，不挂在剪贴墙上。点「新一篇」或左侧已有笔记。</span>
      </div>
      <div class="stage-head" id="stageHead" hidden>
        <button type="button" class="mobile-back" id="mobileBack">列表</button>
        <input id="title" maxlength="120" placeholder="标题" />
        <span class="hint" id="saveHint"></span>
      </div>
      <div id="editor" hidden></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.min.js"></script>
  <script>
    const API = '';
    let notes = [];
    let currentId = null;
    let vditor = null;
    let saveTimer = null;
    let dirty = false;

    function excerpt(md) {
      return (md || '').replace(/^#+\s+/gm, '').replace(/!\[[^\]]*]\([^)]+\)/g, '')
        .replace(/\[([^\]]+)]\([^)]+\)/g, '$1').replace(/[`*_>#-]/g, '')
        .replace(/\s+/g, ' ').trim();
    }
    function titleOf(item) {
      const raw = item.textContent || '';
      const m = raw.match(/^#\s+(.+)$/m);
      if (m) return m[1].trim();
      return excerpt(raw).slice(0, 32) || '未命名';
    }
    function fmtTime(item) {
      const t = item.timestamp || item.firstSeenAt;
      if (!t) return '';
      const d = new Date(typeof t === 'number' && t < 1e12 ? t * 1000 : t);
      return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function paintList() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const root = document.getElementById('list');
      const rows = notes.filter(n => {
        if (!q) return true;
        return (n.textContent || '').toLowerCase().includes(q);
      });
      if (!rows.length) {
        root.innerHTML = '<div class="empty-rail">还没有笔记。点右上角写一篇。</div>';
        return;
      }
      root.innerHTML = rows.map(n => `
        <button type="button" class="note-card${n.id === currentId ? ' is-on' : ''}" data-id="${n.id}">
          <div class="t"></div>
          <div class="x"></div>
          <div class="m"></div>
        </button>`).join('');
      [...root.querySelectorAll('.note-card')].forEach((el, i) => {
        const n = rows[i];
        el.querySelector('.t').textContent = titleOf(n);
        el.querySelector('.x').textContent = excerpt(n.textContent || '');
        el.querySelector('.m').textContent = fmtTime(n);
        el.addEventListener('click', () => openNote(n.id));
      });
    }

    async function loadNotes() {
      const res = await fetch(API + '/api/clips?type=note&limit=80');
      const data = await res.json();
      notes = Array.isArray(data) ? data : (data.items || []);
      paintList();
    }

    function hint(text) { document.getElementById('saveHint').textContent = text || ''; }

    function showEditor() {
      document.getElementById('blank').hidden = true;
      document.getElementById('stageHead').hidden = false;
      document.getElementById('editor').hidden = false;
      document.getElementById('workspace').classList.add('is-editing');
    }

    function bodyWithoutTitle(md, title) {
      const t = (title || '').trim();
      if (!t) return md;
      return md.replace(new RegExp('^#\\s+' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\n?'), '');
    }

    async function uploadImage(file) {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      const res = await fetch(API + '/api/compose/image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: btoa(bin), mime: file.type || 'image/jpeg' }),
      });
      const j = await res.json();
      if (!res.ok || !j.ok || !j.url) throw new Error(j.message || 'upload');
      return j.url;
    }

    function ensureEditor(markdown) {
      showEditor();
      if (vditor) {
        vditor.setValue(markdown || '');
        return;
      }
      vditor = new Vditor('editor', {
        height: Math.max(380, window.innerHeight - 132),
        mode: 'ir',
        lang: 'zh_CN',
        placeholder: '写正文。支持标题、列表、代码、公式；图会进本机 CAS。',
        cache: { enable: false },
        toolbar: [
          'headings', 'bold', 'italic', 'strike', '|',
          'list', 'ordered-list', 'check', 'quote', '|',
          'code', 'inline-code', 'link', 'upload', 'table', '|',
          'undo', 'redo', '|', 'fullscreen', 'outline', 'edit-mode',
        ],
        preview: { markdown: { toc: true, mark: true } },
        upload: {
          accept: 'image/*',
          handler(files) {
            return (async () => {
              try {
                for (const file of files) {
                  const url = await uploadImage(file);
                  vditor.insertValue(`![](${url})`);
                }
                return null;
              } catch (e) {
                return String(e.message || e);
              }
            })();
          },
        },
        input() { scheduleSave(); },
        after() { vditor.setValue(markdown || ''); },
      });
    }

    function scheduleSave() {
      dirty = true;
      hint('未保存');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveNow(), 900);
    }

    async function saveNow() {
      if (!vditor) return;
      const title = (document.getElementById('title').value || '').trim();
      const body = vditor.getValue();
      if (!title && !body.trim()) return;
      hint('保存中…');
      const payload = { body, title: title || null };
      if (currentId) payload.id = currentId;
      try {
        const res = await fetch(API + '/api/compose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await res.json();
        if (!res.ok || j.ok === false) {
          hint(j.message || '没记下');
          return;
        }
        currentId = j.item.id;
        const idx = notes.findIndex(n => n.id === currentId);
        if (idx >= 0) notes[idx] = j.item;
        else notes.unshift(j.item);
        dirty = false;
        hint('已保存');
        paintList();
      } catch (e) {
        hint('没记下');
      }
    }

    async function openNote(id) {
      if (dirty) await saveNow();
      const item = notes.find(n => n.id === id);
      if (!item) return;
      currentId = id;
      const raw = item.textContent || '';
      const t = titleOf(item);
      document.getElementById('title').value = t === '未命名' ? '' : t;
      ensureEditor(bodyWithoutTitle(raw, t === '未命名' ? '' : t));
      paintList();
    }

    async function newNote() {
      if (dirty) await saveNow();
      currentId = null;
      document.getElementById('title').value = '';
      ensureEditor('');
      paintList();
      document.getElementById('title').focus();
    }

    document.getElementById('newBtn').addEventListener('click', newNote);
    document.getElementById('title').addEventListener('input', scheduleSave);
    document.getElementById('q').addEventListener('input', paintList);
    document.getElementById('mobileBack').addEventListener('click', async () => {
      if (dirty) await saveNow();
      document.getElementById('workspace').classList.remove('is-editing');
    });
    window.addEventListener('beforeunload', () => { if (dirty) saveNow(); });
    loadNotes().catch(() => {
      document.getElementById('list').innerHTML = '<div class="empty-rail">笔记列表没打开。</div>';
    });
  </script>
</body>
</html>
