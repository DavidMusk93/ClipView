[package]
name = "clipvault-http"
version = "0.1.0"
edition = "2021"
description = "ClipVault one-hop HTTP/2 (h2c :80 / TLS :443). Origin is CV01, not HTTP."

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26"

[[bin]]
name = "clipvault-http"
path = "src/main.rs"
